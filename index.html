<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle Financeiro</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>💰 Controle Financeiro</h1>

    <p>Organize suas receitas e despesas</p>

    <div class="resumo">

      <div class="card">
        <span>Saldo</span>
        <strong id="saldo">R$ 0,00</strong>
      </div>

      <div class="card">
        <span>Receitas</span>
        <strong id="receitas">R$ 0,00</strong>
      </div>

      <div class="card">
        <span>Despesas</span>
        <strong id="despesas">R$ 0,00</strong>
      </div>

    </div>

    <div class="formulario">

      <h2>Nova movimentação</h2>

      <input
        type="text"
        id="descricao"
        placeholder="Descrição"
      >

      <input
        type="number"
        id="valor"
        placeholder="Valor"
        step="0.01"
      >

      <input
        type="date"
        id="data"
      >

      <select id="tipo">

        <option value="receita">Receita</option>

        <option value="despesa">Despesa</option>

      </select>

      <button onclick="adicionarMovimentacao()">
        Adicionar
      </button>

    </div>

    <div class="movimentacoes">

      <h2>Movimentações</h2>

      <ul id="lista"></ul>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
